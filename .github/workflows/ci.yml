name: CI

on:
  push:
    branches: [ opengl ]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine · ${{ matrix.name }}
    runs-on: ubuntu-latest
    
    container:
      image: fedora:latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: all-modules, modules: "",           network: "OFF" }
          - { name: minimal,     modules: "0000101001", network: "OFF" }
          - { name: no-audio,    modules: "1111011111", network: "OFF" }
          - { name: no-postfx,   modules: "1111111011", network: "OFF" }
          - { name: network,     modules: "",           network: "ON"  }

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dnf install -y --setopt=install_weak_deps=False \
            cmake ninja-build g++ pkg-config git \
            assimp-devel openssl-devel openal-soft-devel postgresql-devel \
            gtk3-devel glm-devel glslang mesa-libGL-devel \
            wayland-devel wayland-protocols-devel \
            libxkbcommon-devel mesa-libEGL-devel

      - name: Checkout submodules manually
        run: |
          git submodule update --init --recursive

      - name: Cache SDL3
        id: cache-sdl
        uses: actions/cache@v4
        with:
          path: ~/sdl3-install
          key: sdl3-${{ runner.os }}-v1

      - name: Build & install SDL3
        if: steps.cache-sdl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/sdl3-install" \
            -DSDL_X11=OFF \
            -DSDL_WAYLAND=ON
          cmake --build /tmp/SDL/build -j"$(nproc)"
          cmake --install /tmp/SDL/build

      - name: Configure
        working-directory: .
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMODULES="${{ matrix.modules }}"
          -DHARUKA_NETWORK=${{ matrix.network }}
          -DCMAKE_PREFIX_PATH="$HOME/sdl3-install"

      - name: Build engine
        working-directory: .
        run: cmake --build build -j"$(nproc)" --target HarukaEngine