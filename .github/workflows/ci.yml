name: CI

# Builds the Haruka engine across several build-time module configurations.
# The module matrix is the point: it proves the modules really isolate (each
# combo below is verified to build) and that disabling one doesn't rot the rest.
# All configs here have been confirmed to compile locally.

on:
  push:
    branches: [ opengl ]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # MODULES bitmask order: FLUIDS DEFORM SOFTBODY NETWORK AUDIO PARTICLES
          #                        TERRAIN POSTFX SHADOWS PHYSICS  ('' = all ON)
          - { name: all-modules, modules: "",           network: "OFF" }
          - { name: minimal,     modules: "0000101001", network: "OFF" } # AUDIO+TERRAIN+PHYSICS
          - { name: no-audio,    modules: "1111011111", network: "OFF" } # AUDIO off → isolation
          - { name: no-postfx,   modules: "1111111011", network: "OFF" } # POSTFX off → isolation
          - { name: network,     modules: "",           network: "ON"  } # DGS client path

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libassimp-dev libssl-dev libopenal-dev libpq-dev \
            libgtk-3-dev libglm-dev glslang-tools libgl1-mesa-dev

      # SDL3 is not in the Ubuntu repos yet → build + install from source (cached).
      - name: Cache SDL3
        id: cache-sdl
        uses: actions/cache@v4
        with:
          path: ~/sdl3-install
          key: sdl3-${{ runner.os }}-v1

      - name: Build & install SDL3
        if: steps.cache-sdl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/sdl3-install"
          cmake --build /tmp/SDL/build -j"$(nproc)"
          cmake --install /tmp/SDL/build

      - name: Configure
        working-directory: .
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMODULES="${{ matrix.modules }}"
          -DHARUKA_NETWORK=${{ matrix.network }}
          -DCMAKE_PREFIX_PATH="$HOME/sdl3-install"

      - name: Build engine
        working-directory: .
        run: cmake --build build -j"$(nproc)" --target HarukaEngine
